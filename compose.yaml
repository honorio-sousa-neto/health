name: health
x-api: &api
  image: health-api:local
  build:
    context: .
    dockerfile: back/Dockerfile
  environment:
    NODE_ENV: production
    PORT: 8020
    DATABASE_URL: postgresql://alfavida:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}@database:5432/alfavida
    JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    UPLOAD_DIR: /app/back/private/uploads
services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: alfavida
      POSTGRES_USER: alfavida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U alfavida -d alfavida']
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    <<: *api
    restart: 'no'
    command: [npm, run, db:migrate]
    depends_on:
      database:
        condition: service_healthy
  api:
    <<: *api
    restart: unless-stopped
    volumes:
      - uploads:/app/back/private/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8020/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    image: health-web:local
    build:
      context: .
      dockerfile: front/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
